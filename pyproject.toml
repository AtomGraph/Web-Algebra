[project]
name = "web-algebra"
version = "2.0.0"
description = "Composable RDF operations in JSON"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Martynas Jusevicius", email = "martynas@atomgraph.com" }
]
requires-python = ">=3.10"
keywords = ["rdf", "sparql", "linked-data", "mcp", "json-dsl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "rdflib>=7.6,<8",
    "openai>=1",
    "mcp>=2.3,<3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn",
    "urllib3>=2.8",
    "elementpath>=5,<6",
]

[project.urls]
Homepage = "https://github.com/AtomGraph/Web-Algebra"
Repository = "https://github.com/AtomGraph/Web-Algebra"
Issues = "https://github.com/AtomGraph/Web-Algebra/issues"

[project.scripts]
web-algebra = "web_algebra.main:cli"
web-algebra-mcp = "web_algebra.__main__:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["web_algebra*"]

[tool.setuptools.package-data]
web_algebra = ["prompts/*.md", "prompts/*.txt", "py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8",
]

[tool.ruff.lint]
# ruff's defaults, stated so that a user-level configuration does not apply
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not network and not sparql and not ldh'"
markers = [
    "unit: pure unit tests (auto-applied to tests/unit/)",
    "integration: JSON-fixture composition tests (auto-applied to tests/integration/)",
    "network: requires live HTTP endpoint",
    "sparql: requires live SPARQL endpoint",
    "ldh: requires LinkedDataHub instance + CERT_PEM_PATH/CERT_PASSWORD",
]
